
name: Tache 3 - Analyse Semgrep

on:
  push:
    branches:
      - tache3
      - tache3-molly
      - tache3-cyreanne
  pull_request:
    branches:
      - tache3
  workflow_dispatch:

jobs:
  semgrep:
    name: Analyse de securite
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Semgrep
        run: python3 -m pip install semgrep

      - name: Analyser tika-core avec Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --json \
            --output semgrep-report.json \
            tika-core
            
      - name: Sauvegarder le rapport Semgrep
        uses: actions/upload-artifact@v4
        with:
            name: semgrep-rapport-initial
            path: semgrep-report.json
