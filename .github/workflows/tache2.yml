name: Tache 2 - tests et PIT

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Installer les modules dont depend tika-core
        run: mvn -B -ntp -pl tika-annotation-processor -am install -DskipTests

      - name: Lancer les tests de ConcurrentUtils et RegexUtils
        run: mvn -B -ntp -pl tika-core test -Dtest='ConcurrentUtils*Test,RegexUtils*Test'

      - name: Lancer PIT
        run: mvn -B -ntp -pl tika-core test-compile org.pitest:pitest-maven:mutationCoverage

      - name: Garder le rapport PIT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-pit
          path: tika-core/target/pit-reports